name: Daily retrain

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC+9)
  workflow_dispatch: {}      # 수동 실행 허용

concurrency:
  group: retrain
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write          # Workload Identity Federation(OIDC) 토큰 발급에 필요

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHP_TOKEN }}   # PAT로 체크아웃해야 이후 push가 deploy 워크플로를 트리거

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Retrain
        env:
          KAMIS_KEY: ${{ secrets.KAMIS_KEY }}
          KAMIS_ID: ${{ secrets.KAMIS_ID }}
          ASOS_KEY: ${{ secrets.ASOS_KEY }}
          COLLECT_URL: ${{ secrets.COLLECT_URL }}       # 한국 IP 필요 → 라이브 서버에 수집 위임
          COLLECT_TOKEN: ${{ secrets.COLLECT_TOKEN }}
          GARAK_ID: ${{ secrets.GARAK_ID }}
          GARAK_PASSWD: ${{ secrets.GARAK_PASSWD }}
          PYTHONUTF8: "1"
        run: python retrain_pipeline.py

      - name: Commit & push if changed
        id: commit
        run: |
          git config user.name cabbage-bot
          git config user.email dudfyd84@gmail.com
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily data/model update (cloud)"
            # 체크아웃 이후 main이 움직였으면(PR 병합 등) push가 거부되고 그날 데이터가 통째로 버려진다.
            # rebase 후 재시도한다. 데이터 파일은 봇만 건드리므로 충돌 여지가 없다.
            for i in 1 2 3; do
              if git push origin main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "push 거부 — main 변경 반영 후 재시도 ($i/3)"
              git pull --rebase origin main
            done
            echo "3회 재시도에도 push 실패"
            exit 1
          fi

      # 재학습이 끝난 뒤(=당일 데이터가 확정된 뒤) 같은 잡에서 DW를 갱신한다.
      # 별도 워크플로로 빼면 "어제 데이터로 오늘 DW를 만드는" 시차가 생긴다.
      # 조직 정책(iam.disableServiceAccountKeyCreation)으로 SA 키를 못 만들어 WIF를 쓴다.
      - name: GCP 인증 (WIF)
        id: auth
        continue-on-error: true      # 인증 실패가 재학습 전체를 죽이지 않도록 (스크립트는 dry-run으로 빠짐)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: BigQuery 일배치 적재
        env:
          PYTHONUTF8: "1"
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
        run: |
          pip install -r requirements-batch.txt
          python bq_daily_load.py

      - name: 배포 반영 대기 후 카카오 급등 알림
        # 재학습으로 실제 변경(push)이 있었을 때만 실행 — main에 다른 커밋이 올라갈 때(deploy.yml)는
        # 발송하지 않음. push 직후엔 Cloudtype 배포가 아직 안 끝나 어제자 예측이 조회될 수 있어,
        # /api/dashboard의 date가 방금 재학습한 날짜와 같아질 때까지 최대 10분 대기 후 발송.
        # continue-on-error: 알림 실패가 재학습 워크플로 전체를 실패로 만들지 않도록.
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          KAKAO_BIZ_API_KEY: ${{ secrets.KAKAO_BIZ_API_KEY }}
          KAKAO_SENDER_KEY: ${{ secrets.KAKAO_SENDER_KEY }}
          ALERT_RECEIVER_PHONE: ${{ secrets.ALERT_RECEIVER_PHONE }}
        run: |
          LATEST=$(grep -o '데이터 최신일 [0-9-]*' retrain_log.txt | tail -1 | awk '{print $NF}')
          echo "재학습된 데이터 최신일: ${LATEST:-(확인 실패)}"
          if [ -z "$LATEST" ]; then
            echo "LATEST 추출 실패 — 배포 반영 대기 없이 바로 발송"
          else
            for i in $(seq 1 20); do
              LIVE_DATE=$(curl -s "$DASHBOARD_URL" | python -c "import json,sys; print(json.load(sys.stdin).get('date',''))" 2>/dev/null || echo "")
              if [ "$LIVE_DATE" = "$LATEST" ]; then
                echo "배포에 최신 데이터 반영 확인(date=$LIVE_DATE) — 알림 발송"
                break
              fi
              echo "배포 반영 대기 중... ($i/20, 현재 배포된 date=$LIVE_DATE)"
              sleep 30
            done
          fi
          python notify_kakao.py
