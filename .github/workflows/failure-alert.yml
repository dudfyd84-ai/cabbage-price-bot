name: Failure alert

# 자동화 워크플로가 실패하면 이슈로 알린다.
# (2026-07 장애 재발 방지: GHP_TOKEN 만료로 두 워크플로가 3일간 조용히 실패했음)
# 감시 대상은 '실패해도 아무도 모르는' 무인 워크플로 전부다. 새 배치를 추가하면 여기도 추가할 것.

on:
  workflow_run:
    workflows: ["Deploy to cloudtype", "Daily retrain", "Weekly report", "BOM cost simulation", "Keepalive"]
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: 이슈 생성 또는 코멘트
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const label = 'ci-failure';
            const title = `🚨 자동화 실패: ${run.name}`;
            const body = [
              `**워크플로**: ${run.name}`,
              `**실패 시각**: ${run.updated_at}`,
              `**로그**: ${run.html_url}`,
              '',
              '### 확인 순서',
              '1. 위 로그에서 실패 단계를 확인한다.',
              '2. `Bad credentials` / `403 denied` → `GHP_TOKEN` 만료·권한 문제.',
              '   → https://github.com/settings/tokens 에서 토큰 확인(스코프 `repo` 필수),',
              '     교체는 `gh secret set GHP_TOKEN --repo ${{ github.repository }}` (값은 프롬프트에 입력).',
              '3. Cloudtype 쪽 `Not Found` → https://cloudtype.io 에서 프로젝트·`CLOUDTYPE_TOKEN` 확인.',
              '4. 복구 후 워크플로를 수동 실행해 성공을 확인하고 이 이슈를 닫는다.',
            ].join('\n');

            // 같은 워크플로의 열린 이슈가 있으면 코멘트만 추가 (매일 중복 생성 방지)
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 50,
            });
            const dup = open.find(i => i.title === title);

            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number,
                body: `↳ 또 실패했습니다 (${run.updated_at}). 로그: ${run.html_url}`,
              });
              core.info(`기존 이슈 #${dup.number}에 코멘트 추가`);
            } else {
              // 라벨이 없으면 먼저 만든다
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name: label,
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: label, color: 'B60205', description: '배포·재학습 자동화 실패',
                });
              }
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label], assignees: ['dudfyd84-ai'],
              });
              core.info(`이슈 #${issue.number} 생성`);
            }
