name: Keepalive

# 원인 확정 — Cloudtype 콘솔에 이렇게 적혀 있다.
#   "프리티어 리소스는 매일 1회 중지됩니다."
# 유휴 때문이 아니라 하루 한 번 정해진 대로 꺼진다. 두드려도 막을 수 없다.
# 꺼지면 replica가 0이 되고 요청으로는 깨어나지 않는다. 배포만이 다시 1로 올린다.
#
# 그래서 이 워크플로가 하는 일은 '예방'이 아니라 '빨리 되살리기'다.
#  - 평시: 10분마다 확인해 죽어 있으면 배포를 건다.
#  - 자정 직후: 중지 시각으로 추정되는 구간을 6분 간격으로 촘촘히 훑는다.
# 살아 있을 때의 uptime을 매번 기록한다. uptime이 리셋된 시각이 곧 중지 시각이라
# 며칠 쌓이면 실제 중지 시각을 확정할 수 있다.

on:
  schedule:
    - cron: "*/10 * * * *"                  # 평시 — 최대 10분 안에 복구
    - cron: "2,8,14,20,26 15 * * *"         # 00:02~00:26 KST — 중지 직후 촘촘히
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: read
  actions: write      # 죽었을 때 deploy 워크플로를 트리거하려면 필요
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 상태 확인
        id: check
        env:
          URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          # DASHBOARD_URL은 /api/dashboard를 가리키므로 호스트만 떼어 쓴다.
          BASE=$(echo "$URL" | sed -E 's#(https?://[^/]+).*#\1#')
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "| 시각(KST) | 상태 | 가동 | 메모리 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          BODY=$(curl -s -m 20 "$BASE/health" || true)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$BASE/health" || echo 000)
          echo "HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "alive=true" >> "$GITHUB_OUTPUT"
            echo "$BODY" | head -c 400
            UP=$(echo "$BODY" | grep -o '"uptime_s":[0-9]*' | cut -d: -f2)
            MEM=$(echo "$BODY" | grep -o '"peak_rss_mb":[0-9]*' | cut -d: -f2)
            echo ""
            echo "살아 있음 — 가동 ${UP:-?}초 · 최대 메모리 ${MEM:-?}MB"
            # 실행 요약에 남긴다. uptime이 작아진 시점이 곧 중지 시각이다.
            KST=$(TZ=Asia/Seoul date '+%m-%d %H:%M')
            echo "| $KST | 살아 있음 | ${UP:-?}초 | ${MEM:-?}MB |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "alive=false" >> "$GITHUB_OUTPUT"
            echo "죽어 있음 (HTTP $CODE) — 배포로 재기동한다"
            KST=$(TZ=Asia/Seoul date '+%m-%d %H:%M')
            echo "| $KST | **중지됨** | — | — |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 재기동
        if: steps.check.outputs.alive == 'false'
        env:
          GH_TOKEN: ${{ secrets.GHP_TOKEN }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }} --ref main

      - name: 복구 확인
        if: steps.check.outputs.alive == 'false'
        id: recover
        run: |
          BASE="${{ steps.check.outputs.base }}"
          # 컨테이너 재빌드에 수 분이 걸린다. 최대 9분까지 기다린다.
          for i in $(seq 1 18); do
            sleep 30
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$BASE/health" || echo 000)
            echo "  $((i*30))초 경과 — HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "복구 완료"
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "9분 안에 복구되지 않음"
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: 복구 실패 시 이슈 알림
        if: steps.check.outputs.alive == 'false' && steps.recover.outputs.ok != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 라이브 앱 자동 복구 실패';
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: [] });
            const found = data.find(i => i.title === title);
            const body = `자동 재기동을 걸었지만 9분 안에 살아나지 않았습니다.\n\n` +
              `실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Cloudtype 콘솔에서 앱 상태와 종료 사유를 확인해야 합니다. (#68)`;
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
