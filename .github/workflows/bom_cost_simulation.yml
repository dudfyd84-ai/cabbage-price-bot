name: BOM cost simulation

on:
  schedule:
    - cron: "10 22 * * *"   # 매일 재학습(retrain.yml, 06:00 KST) 이후 반영되도록 07:10 KST
  workflow_dispatch: {}       # 수동 실행 허용

jobs:
  bom-cost-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-batch.txt

      - name: Run BOM cost simulation
        env:
          PYTHONUTF8: "1"
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
          BQ_TABLE: ${{ vars.BQ_TABLE }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
          fi
          python bom_cost_simulation.py
